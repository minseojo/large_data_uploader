spring:
  application:
    name: big-size-uploader
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB

upload:
  dir: /minseo/upload_temp

server:
  port: 8080

seaweedfs:
  s3:
    endpoint: http://192.168.0.30:8333      # SeaweedFS S3 게이트웨이 주소
    access-key: ws3dmfs
    secret-key: ws3dmfs1234
    bucket: raster
    region: us-east-1                    # SeaweedFS는 region 무관, 형식 맞추기용
    presigned-url-expiry-minutes: 60     # Presigned URL 유효 시간

cors:
  allowed-origins:
    - http://localhost:5500
    - http://127.0.0.1:5500
