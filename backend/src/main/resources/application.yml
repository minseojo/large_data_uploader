spring:
  application:
    name: big-size-uploader
  # 백엔드는 presigned URL만 발급하므로 자체 multipart 설정 불필요
  servlet:
    multipart:
      enabled: false

server:
  port: 8080

seaweedfs:
  s3:
    endpoint: http://192.168.0.30:8333      # SeaweedFS S3 게이트웨이 주소
    access-key: ws3dmfs
    secret-key: ws3dmfs1234
    bucket: raster
    region: us-east-1                    # SeaweedFS는 region 무관, 형식 맞추기용
    presigned-url-expiry-minutes: 60     # Presigned URL 유효 시간

cors:
  allowed-origins:
    - http://localhost:5500
    - http://127.0.0.1:5500
